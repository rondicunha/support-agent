# Build tool used to package the project (like Maven's build plugins).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Project metadata and runtime dependencies (like groupId/artifactId/version/dependencies).
[project]
name = "support-agent"
version = "0.1.0"
description = "AI support assistant that answers from a FAQ and opens tickets via tool calling."
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

# Development-only dependencies (like Maven's <scope>test</scope>).
# Install with: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Tool configuration lives in the same file, under [tool.<name>].

# Non-Python files to ship inside the package (by default only .py files are included).
[tool.setuptools.package-data]
support_agent = ["data/*.md"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
